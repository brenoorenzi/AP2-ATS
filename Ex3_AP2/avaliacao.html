<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação disciplina automação de teste de software</title>
</head>
<body>

    <h2>Avaliação disciplina automação de teste de software</h2>
    
    <label for="nome">Nome</label><br>
    <input type="text" id="nome" name="nome"><br><br>

    <label for="ra">RA</label><br>
    <input type="text" id="ra" name="ra"><br><br>

    <label>Data de Nascimento (Dia / Mês / Ano)</label><br>
    <input type="text" id="dia" placeholder="Dia">
    <input type="text" id="mes" placeholder="Mês">
    <input type="text" id="ano" placeholder="Ano"><br><br>

    <label for="curso">Lista Curso</label><br>
    <select id="curso">
        <option value="" disabled selected>Selecione...</option>
        <option value="ADS">Análise e Desenvolvimento de Sistemas</option>
        <option value="SI">Sistemas de Informação</option>
    </select><br><br>

    <label for="aproveitamento">Lista Aproveitamento do conteúdo</label><br>
    <select id="aproveitamento">
        <option value="" disabled selected>Nota de 0 a 10...</option>
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
    </select><br><br>

    <label for="sugestoes">Sugestões de melhoria próximas turmas</label><br>
    <textarea id="sugestoes" rows="3" cols="40"></textarea><br><br>

    <label for="observacoes">Observações</label><br>
    <textarea id="observacoes" rows="2" cols="40"></textarea><br><br>

    <button type="button" id="enviarFeedback">Enviar Feedback</button>

</body>
</html>
